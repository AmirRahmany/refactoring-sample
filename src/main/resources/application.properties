spring.application.name=javaHamkelasi

# Provide via JVM system props or env vars at runtime. Examples:
#   -Ddb.url=jdbc:sqlserver://localhost:1433;databaseName=Hamkelasi;encrypt=false
#   -Ddb.user=sa -Ddb.password=YourStrong!Passw0rd

server.port=8083
# Temporary H2 database for development
spring.datasource.url=jdbc:mariadb://localhost:3306/hamkelasi?useSSL=false&serverTimezone=UTC
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=springstudent
spring.datasource.password=springstudent
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=none
logging.level.org.springframework.jdbc=DEBUG

#spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:hamkelasi.sql
spring.sql.init.data-locations=classpath:hamkelasi.sql
spring.jpa.defer-datasource-initialization=false
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp
spring.thymeleaf.cache=false

# Show complete error details
server.error.include-message=always
server.error.include-stacktrace=always
server.error.include-binding-errors=always
server.error.include-exception=true

# Logging configuration
logging.level.com.hamkelasi=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=DEBUG

# Log all errors to file
logging.file.name=application.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} - %msg%n%ex

# Show SQL queries and parameters
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.type=trace
src/main/java/com/hamkelasi