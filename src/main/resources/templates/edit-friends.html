<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت دوستان</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <style>
        .error-big {
            color: #d9534f;
            font-weight: bold;
            display: block;
            padding: 10px;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            border-radius: 4px;
            margin: 10px 0;
        }

        .title {
            color: #333;
            border-bottom: 2px solid #007acc;
            padding-bottom: 5px;
            margin-top: 30px;
            font-weight: bold;
        }

        .member-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            border: 1px solid #dee2e6;
        }

        .member-table th,
        .member-table td {
            padding: 12px;
            text-align: center;
            border: 1px solid #dee2e6;
            vertical-align: middle;
        }

        .member-table th {
            background-color: #f8f9fa;
            font-weight: bold;
            color: #495057;
        }

        .member-table img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
        }

        .btn-action {
            padding: 5px 10px;
            font-size: 0.9em;
            margin: 2px;
        }

        /* RTL specific styles */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .text-center {
            text-align: center;
        }
    </style>
</head>
<body>
<!-- Header inclusion -->
<div th:replace="fragments/header :: header"></div>

<div class="container">
    <div id="page">
        <div id="content">
            <div class="post">
                <h3 class="title" id="headFriends">لیست دوستان</h3>

                <div class="entry">
                    <!-- Error message display -->
                    <div th:if="${errorMessage}" th:text="${errorMessage}" class="error-big"></div>

                    <!-- Friends List Table -->
                    <table class="member-table" th:if="${not #lists.isEmpty(friends)}">
                        <thead>
                        <tr>
                            <th>تصویر پروفایل</th>
                            <th>نام کاربری</th>
                            <th>نام و نام خانوادگی</th>
                            <th>مشاهده پروفایل</th>
                            <th>حذف دوستی</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="friend : ${friends}">
                            <td>
                                <img th:src="${friend.profilePicture != null} ?
                                            @{'/images/profiles/' + ${friend.profilePicture}} :
                                            @{'/images/default-profile.png'}"
                                     alt="پروفایل" />
                            </td>
                            <td th:text="${friend.username}"></td>
                            <td th:text="${friend.firstname + ' ' + friend.lastname}"></td>
                            <td>
                                <a th:href="@{'/profile/' + ${friend.username}}"
                                   class="btn btn-primary btn-action">مشاهده</a>
                            </td>
                            <td>
                                <form th:action="@{'/friends/remove/' + ${friend.id}}" method="post">
                                    <button type="submit" class="btn btn-danger btn-action"
                                            onclick="return confirm('آیا از حذف این دوست اطمینان دارید؟')">
                                        حذف
                                    </button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>

                    <div th:if="${#lists.isEmpty(friends)}" class="alert alert-info text-center">
                        هیچ دوستی ندارید.
                    </div>

                    <br /><br /><br />

                    <!-- Pending Friend Requests -->
                    <h3 class="title" id="headWaiting">درخواست های دوستی تایید نشده</h3>

                    <table class="member-table" th:if="${not #lists.isEmpty(pendingRequests)}">
                        <thead>
                        <tr>
                            <th>تصویر پروفایل</th>
                            <th>نام کاربری</th>
                            <th>نام و نام خانوادگی</th>
                            <th>مشاهده پروفایل</th>
                            <th>تایید دوستی</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="request : ${pendingRequests}">
                            <td>
                                <img th:src="${request.sender.profilePicture != null} ?
                                            @{'/images/profiles/' + ${request.sender.profilePicture}} :
                                            @{'/images/default-profile.png'}"
                                     alt="پروفایل" />
                            </td>
                            <td th:text="${request.sender.username}"></td>
                            <td th:text="${request.sender.firstname + ' ' + request.sender.lastname}"></td>
                            <td>
                                <a th:href="@{'/profile/' + ${request.sender.username}}"
                                   class="btn btn-primary btn-action">مشاهده</a>
                            </td>
                            <td>
                                <form th:action="@{'/friends/accept/' + ${request.id}}" method="post" style="display: inline;">
                                    <button type="submit" class="btn btn-success btn-action">تایید</button>
                                </form>
                                <form th:action="@{'/friends/reject/' + ${request.id}}" method="post" style="display: inline;">
                                    <button type="submit" class="btn btn-danger btn-action">رد</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>

                    <div th:if="${#lists.isEmpty(pendingRequests)}" class="alert alert-info text-center">
                        هیچ درخواست دوستی pending ندارید.
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Footer inclusion -->
<div th:replace="fragments/footer :: footer"></div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
