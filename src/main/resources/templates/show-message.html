<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">مشاهده پیام</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <style>
        .error-big {
            color: #d9534f;
            font-weight: bold;
            display: block;
            padding: 10px;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            border-radius: 4px;
            margin: 10px 0;
        }

        .title {
            color: #333;
            border-bottom: 2px solid #007acc;
            padding-bottom: 5px;
            margin-top: 30px;
            font-weight: bold;
        }

        .message-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        .message-table td {
            padding: 12px;
            vertical-align: top;
        }

        .message-table tr:nth-child(even) {
            background-color: #f8f9fa;
        }

        .message-label {
            font-weight: bold;
            color: #495057;
            text-align: left;
            width: 120px;
        }

        .message-content {
            background-color: white;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            padding: 15px;
            min-height: 250px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        /* RTL specific styles */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .action-buttons {
            margin-top: 20px;
            text-align: left;
        }
    </style>
</head>
<body>
<!-- Header inclusion -->
<div th:replace="fragments/header :: header"></div>

<div class="container">
    <div id="page">
        <div id="content">
            <div class="post">
                <h3 class="title">پیام خصوصی</h3>

                <div class="entry">
                    <!-- Error message display -->
                    <div th:if="${errorMessage}" th:text="${errorMessage}" class="error-big"></div>

                    <!-- Message display panel -->
                    <div th:if="${message}" id="panelShowMessage">
                        <table class="message-table">
                            <tr>
                                <td class="message-label">
                                    <span th:text="${isInbox} ? 'فرستنده :' : 'گیرنده :'"></span>
                                </td>
                                <td>
                                    <span th:text="${isInbox} ? ${message.sender} : ${message.recipient}"></span>
                                </td>
                            </tr>
                            <tr>
                                <td class="message-label">موضوع :</td>
                                <td>
                                    <span th:text="${message.subject}"></span>
                                </td>
                            </tr>
                            <tr>
                                <td class="message-label">تاریخ ارسال :</td>
                                <td>
                                    <span th:text="${#temporals.format(message.sentDate, 'yyyy/MM/dd HH:mm')}"></span>
                                </td>
                            </tr>
                            <tr>
                                <td class="message-label">متن :</td>
                                <td>
                                    <div class="message-content" th:text="${message.content}"></div>
                                </td>
                            </tr>
                        </table>

                        <!-- Action buttons -->
                        <div class="action-buttons">
                            <a th:href="@{${isInbox} ? '/inbox' : '/outbox'}"
                               class="btn btn-secondary">بازگشت</a>
                            <a th:if="${isInbox}"
                               th:href="@{'/messages/reply/' + ${message.id}}"
                               class="btn btn-primary me-2">پاسخ</a>
                            <a th:href="@{'/messages/delete/' + ${message.id}}"
                               class="btn btn-danger me-2"
                               onclick="return confirm('آیا از حذف این پیام اطمینان دارید؟')">حذف</a>
                        </div>
                    </div>

                    <!-- No message found -->
                    <div th:unless="${message}" class="alert alert-warning">
                        پیامی یافت نشد.
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Footer inclusion -->
<div th:replace="fragments/footer :: footer"></div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
