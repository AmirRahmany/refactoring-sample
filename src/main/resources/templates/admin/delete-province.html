<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حذف استان</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <style>
        .error-big {
            color: #d9534f;
            font-weight: bold;
            display: block;
            padding: 10px;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            border-radius: 4px;
            margin: 10px 0;
        }

        .green-button {
            background-color: #28a745;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
        }

        .green-button:hover {
            background-color: #218838;
        }

        .red-button {
            background-color: #dc3545;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
        }

        .red-button:hover {
            background-color: #c82333;
        }

        .form-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        .form-table td {
            padding: 12px;
            vertical-align: top;
        }

        .form-label {
            font-weight: bold;
            color: #495057;
            text-align: right;
            width: 150px;
            padding-left: 20px;
        }

        /* RTL specific styles */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        .text-center {
            text-align: center;
        }

        .mb-3 {
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
<!-- Header inclusion -->
<div th:replace="fragments/header :: header"></div>

<div class="container">
    <div id="page">
        <div id="content">
            <div class="post">
                <h3 class="title">حذف استان</h3>
                <div class="entry">
                    <!-- Error message display -->
                    <div th:if="${errorMessage}" th:text="${errorMessage}" class="error-big"></div>

                    <!-- Delete Confirmation Panel -->
                    <div th:if="${showDeletePanel != false}" class="mt-4">
                        <p>آیا مایل به حذف استان زیر هستید؟ با حذف این استان تمام اطلاعات زیر حذف خواهند شد و به هیچ وجه قابل بازگشت نخواهند بود.</p>
                        <table class="form-table">
                            <tr>
                                <td class="form-label">نام استان:</td>
                                <td th:text="${provinceName}"></td>
                            </tr>
                            <tr>
                                <td class="form-label">تعداد شهرها:</td>
                                <td th:text="${cityCount}"></td>
                            </tr>
                            <tr>
                                <td class="form-label">تعداد مدارس:</td>
                                <td th:text="${schoolCount}"></td>
                            </tr>
                        </table>
                        <p>همچنین تمام پست‌ها و فایل‌های موجود در گالری حذف خواهند شد. آیا مایل به ادامه هستید؟</p>
                        <div class="text-center">
                            <form th:action="@{/admin/DeleteProvince}" method="post" style="display: inline;">
                                <input type="hidden" name="provinceId" th:value="${provinceId}" />
                                <button type="submit" name="action" value="no" class="green-button">خیر</button>
                                <button type="submit" name="action" value="yes" class="red-button">بله</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Footer inclusion -->
<div th:replace="fragments/footer :: footer"></div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
