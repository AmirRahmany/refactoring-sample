<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اضافه کردن مدرسه</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <style>
        .error-big {
            color: #d9534f;
            font-weight: bold;
            display: block;
            padding: 10px;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            border-radius: 4px;
            margin: 10px 0;
        }

        .error-small {
            color: #d9534f;
            font-size: 0.9em;
            margin-top: 5px;
            display: block;
        }

        .form-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        .form-table td {
            padding: 12px;
            vertical-align: top;
        }

        .form-label {
            font-weight: bold;
            color: #495057;
            text-align: right;
            width: 150px;
            padding-left: 20px;
        }

        .form-control {
            width: 250px;
        }

        .green-button {
            background-color: #28a745;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        .green-button:hover {
            background-color: #218838;
        }

        .title {
            color: #333;
            border-bottom: 2px solid #007acc;
            padding-bottom: 5px;
            margin-top: 30px;
            font-weight: bold;
        }

        /* RTL specific styles */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .text-center {
            text-align: center;
        }
    </style>
</head>
<body>
<!-- Header inclusion -->
<div th:replace="fragments/header :: header"></div>

<div class="container">
    <div id="page">
        <div id="content">
            <div class="post">
                <h3 class="title">اضافه کردن مدرسه</h3>

                <div class="entry">
                    <!-- Error message display -->
                    <div th:if="${errorMessage}" th:text="${errorMessage}" class="error-big"></div>

                    <!-- Add School Form - Only show if authenticated -->
                    <div th:if="${panelVisible}">
                        <form th:action="@{/admin/AddSchool}" method="post">
                            <table class="form-table">
                                <tr>
                                    <td class="form-label">نام آموزشگاه :</td>
                                    <td>
                                        <input type="text" name="textSchoolName" id="textSchoolName"
                                               class="form-control" required maxlength="100" />
                                        <span style="color: red">*</span>
                                    </td>
                                </tr>

                                <tr>
                                    <td class="form-label">نوع آموزشگاه :</td>
                                    <td>
                                        <select name="listSchoolType" id="listSchoolType" class="form-control" required>
                                            <option value="">-- انتخاب نوع --</option>
                                            <option th:each="type : ${schoolTypes}"
                                                    th:value="${type.id}"
                                                    th:text="${type.typeName}">
                                            </option>
                                        </select>
                                    </td>
                                </tr>

                                <tr>
                                    <td class="form-label">نام استان :</td>
                                    <td>
                                        <select name="listProvince" id="listProvince" class="form-control" required
                                                onchange="updateCities()">
                                            <option value="">-- انتخاب استان --</option>
                                            <option th:each="province : ${provinces}"
                                                    th:value="${province.id}"
                                                    th:text="${province.name}">
                                            </option>
                                        </select>
                                    </td>
                                    <td>
                                        <button type="button" class="green-button" onclick="updateCities()">
                                            نمایش شهرها
                                        </button>
                                    </td>
                                </tr>

                                <tr>
                                    <td class="form-label">نام شهر :</td>
                                    <td>
                                        <select name="listCity" id="listCity" class="form-control" required>
                                            <option value="">-- انتخاب شهر --</option>
                                            <option th:each="city : ${cities}"
                                                    th:value="${city.id}"
                                                    th:text="${city.name}">
                                            </option>
                                        </select>
                                    </td>
                                </tr>

                                <tr>
                                    <td colspan="2" class="text-center">
                                        <button type="submit" class="green-button">ثبت آموزشگاه</button>
                                    </td>
                                </tr>
                            </table>
                        </form>
                    </div>

                    <!-- Not authenticated message -->
                    <div th:unless="${panelVisible}" class="alert alert-danger">
                        شما مجوز دسترسی به این صفحه را ندارید
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- JavaScript for city dropdown update -->
<script>
    function updateCities() {
        var provinceSelect = document.getElementById('listProvince');
        var provinceId = provinceSelect.value;

        if (provinceId) {
            // Create a form and submit to update cities
            var form = document.createElement('form');
            form.method = 'post';
            form.action = '/admin/AddSchool';

            var input = document.createElement('input');
            input.type = 'hidden';
            input.name = 'action';
            input.value = 'showCities';
            form.appendChild(input);

            var provinceInput = document.createElement('input');
            provinceInput.type = 'hidden';
            provinceInput.name = 'provinceId';
            provinceInput.value = provinceId;
            form.appendChild(provinceInput);

            document.body.appendChild(form);
            form.submit();
        }
    }
</script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
