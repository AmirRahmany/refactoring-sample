<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ویرایش کاربران</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <style>
        .error-big {
            color: #d9534f;
            font-weight: bold;
            display: block;
            padding: 10px;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            border-radius: 4px;
            margin: 10px 0;
        }
        
        .table-result {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        
        .table-result th, .table-result td {
            padding: 12px;
            border: 1px solid #dee2e6;
            text-align: center;
            vertical-align: middle;
        }
        
        .header-row {
            background-color: #f8f9fa;
            font-weight: bold;
            color: #495057;
        }
        
        .odd-row {
            background-color: #f8f9fa;
        }
        
        .even-row {
            background-color: #ffffff;
        }
        
        .green-button {
            background-color: #28a745;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        
        .green-button:hover {
            background-color: #218838;
        }
        
        .form-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        
        .form-table td {
            padding: 12px;
            vertical-align: top;
        }
        
        .form-label {
            font-weight: bold;
            color: #495057;
            text-align: right;
            width: 150px;
            padding-left: 20px;
        }
        
        .form-control {
            width: 300px;
        }
        
        /* RTL specific styles */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .text-center {
            text-align: center;
        }
    </style>
</head>
<body>
<!-- Header inclusion -->
<div th:replace="fragments/header :: header"></div>

<div class="container">
    <div id="page">
        <div id="content">
            <div class="post">
                <div class="entry">
                    <!-- Error message display -->
                    <div th:if="${errorMessage}" th:text="${errorMessage}" class="error-big"></div>

                    <!-- Success message -->
                    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

                    <!-- Users Table -->
                    <div th:if="${tableUsersVisible}">
                        <table class="table-result">
                            <tr class="header-row">
                                <th>کد</th>
                                <th>نام کاربری</th>
                                <th>نام و نام خانوادگی</th>
                                <th>ویرایش</th>
                            </tr>
                            <tr th:each="user, status : ${userList}"
                                th:class="${status.odd} ? 'odd-row' : 'even-row'">
                                <td th:text="${user.id}"></td>
                                <td th:text="${user.username}"></td>
                                <td th:text="${user.firstname + ' ' + user.lastname}"></td>
                                <td>
                                    <a th:href="@{'/admin/edit-users?ID=' + ${user.id}}">
                                        <img src="/images/edit-icon.png" alt="ویرایش" width="20" height="20" />
                                    </a>
                                </td>
                            </tr>
                        </table>
                    </div>

                    <!-- Edit User Panel -->
                    <div th:if="${panelEditUserVisible}">
                        <form th:action="@{/admin/edit-users}" method="post" enctype="multipart/form-data">
                            <input type="hidden" name="userId" th:value="${userId}" />

                            <table class="form-table">
                                <tr>
                                    <td class="form-label">کد کاربری :</td>
                                    <td th:text="${userId}"></td>
                                </tr>
                                <tr>
                                    <td class="form-label">نام کاربری :</td>
                                    <td>
                                        <input type="text" name="textUsername" th:value="${userUsername}"
                                               class="form-control" required />
                                    </td>
                                </tr>
                                <tr>
                                    <td class="form-label">رمز عبور :</td>
                                    <td>
                                        <input type="password" name="textPassword" th:value="${userPassword}"
                                               class="form-control" />
                                    </td>
                                </tr>
                                <tr>
                                    <td class="form-label">نام :</td>
                                    <td>
                                        <input type="text" name="textFirstname" th:value="${userFirstname}"
                                               class="form-control" />
                                    </td>
                                </tr>
                                <tr>
                                    <td class="form-label">نام خانوادگی :</td>
                                    <td>
                                        <input type="text" name="textLastname" th:value="${userLastname}"
                                               class="form-control" />
                                    </td>
                                </tr>
                                <tr>
                                    <td class="form-label">ایمیل :</td>
                                    <td>
                                        <input type="email" name="textEmail" th:value="${userEmail}"
                                               class="form-control" />
                                    </td>
                                </tr>
                                <tr>
                                    <td class="form-label">وب سایت :</td>
                                    <td>
                                        <input type="url" name="textWebsite" th:value="${userWebsite}"
                                               class="form-control" />
                                    </td>
                                </tr>
                                <tr>
                                    <td class="form-label">عکس پروفایل :</td>
                                    <td>
                                        <input type="file" name="fileUpload" class="form-control" />
                                    </td>
                                    <td>
                                        <img th:if="${userProfilePicture}"
                                             th:src="@{'/user-images/' + ${userProfilePicture}}"
                                             width="50" height="50" alt="پروفایل" />
                                    </td>
                                </tr>
                                <tr th:if="${editPermissionVisible}">
                                    <td class="form-label">سطح دسترسی :</td>
                                    <td>
                                        <select name="listPermission" class="form-control">
                                            <option th:each="permission : ${permissionList}"
                                                    th:value="${permission.id}"
                                                    th:text="${permission.permissionName}"
                                                    th:selected="${userPermission == permission.id}">
                                            </option>
                                        </select>
                                    </td>
                                </tr>
                                <tr>
                                    <td colspan="2">
                                        <input type="checkbox" name="checkPmActive" id="checkPmActive"
                                               th:checked="${userPmActive}" />
                                        <label for="checkPmActive">دریافت پیام خصوصی از اعضای سایت</label>
                                    </td>
                                </tr>
                                <tr>
                                    <td colspan="2" class="text-center">
                                        <button type="submit" class="green-button">ذخیره تغییرات</button>
                                    </td>
                                </tr>
                            </table>
                        </form>
                    </div>

                    <!-- Not authenticated message -->
                    <div th:if="${not panelEditUserVisible and not tableUsersVisible}" class="alert alert-danger">
                        <span th:if="${errorMessage}" th:text="${errorMessage}"></span>
                        <span th:unless="${errorMessage}">شما مجوز دسترسی به این صفحه را ندارید</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Footer inclusion -->
<div th:replace="fragments/footer :: footer"></div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
