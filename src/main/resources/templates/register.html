<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">ثبت نام</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <style>
        .error-big {
            color: #d9534f;
            font-weight: bold;
            display: block;
            padding: 10px;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            border-radius: 4px;
            margin: 10px 0;
        }

        .error-small {
            color: #d9534f;
            font-size: 0.9em;
            margin-top: 5px;
            display: block;
        }

        .title {
            color: #333;
            border-bottom: 2px solid #007acc;
            padding-bottom: 5px;
            margin-top: 30px;
            font-weight: bold;
        }

        .register-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        .register-table td {
            padding: 12px;
            vertical-align: top;
        }

        .register-label {
            font-weight: bold;
            color: #495057;
            text-align: left;
            width: 150px;
            padding-right: 20px;
        }

        .form-control {
            width: 250px;
        }

        .english-input {
            direction: ltr;
            text-align: left;
        }

        .green-button {
            background-color: #28a745;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        .green-button:hover {
            background-color: #218838;
        }

        /* RTL specific styles */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .form-check {
            text-align: right;
            margin: 15px 0;
        }

        .text-center {
            text-align: center;
        }
    </style>
</head>
<body>
<!-- Header inclusion -->
<div th:replace="fragments/header :: header"></div>

<div class="container">
    <div id="page">
        <div id="content">
            <div class="post">
                <h3 class="title">ثبت نام</h3>

                <div class="entry">
                    <!-- Success message -->
                    <div th:if="${param.action != null and param.action == 'successfull'}" class="alert alert-success" th:text="${successMessage}"></div>

                    <!-- Error message -->
                    <div th:if="${labelError}" th:text="${errorMessage}" class="error-big"></div>

                    <form  th:action="@{/register}" method="post" enctype="multipart/form-data">
                        <table class="register-table">
                            <tr>
                                <td class="register-label">نام کاربری :</td>
                                <td>
                                    <input type="text" name="textUsername" class="form-control" maxlength="50" />
                                    <span th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="error-small"></span>
                                </td>
                            </tr>
                            <tr>
                                <td class="register-label">رمز عبور :</td>
                                <td>
                                    <input type="password" name="textPassword" class="form-control" maxlength="30" />
                                    <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="error-small"></span>
                                </td>
                            </tr>
                            <tr>
                                <td class="register-label">نام :</td>
                                <td>
                                    <input type="text" name="textFirstname" class="form-control" maxlength="25" />
                                    <span th:if="${#fields.hasErrors('firstname')}" th:errors="*{firstname}" class="error-small"></span>
                                </td>
                            </tr>
                            <tr>
                                <td class="register-label">نام خانوادگی :</td>
                                <td>
                                    <input type="text" name="textLastname" class="form-control" maxlength="25" />
                                    <span th:if="${#fields.hasErrors('lastname')}" th:errors="*{lastname}" class="error-small"></span>
                                </td>
                            </tr>
                            <tr>
                                <td class="register-label">ایمیل :</td>
                                <td>
                                    <input type="email" name="textEmail" class="form-control english-input" maxlength="50" />
                                    <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error-small"></span>
                                </td>
                            </tr>
                            <tr>
                                <td class="register-label">وب سایت :</td>
                                <td>
                                    <input type="url" name="textWebsite" class="form-control english-input" maxlength="50" />
                                    <span th:if="${#fields.hasErrors('website')}" th:errors="*{website}" class="error-small"></span>
                                </td>
                            </tr>
                            <tr>
                                <td class="register-label">عکس پروفایل :</td>
                                <td>
                                    <input type="file" name="profilePicture" class="form-control" accept="image/*" />
                                </td>
                            </tr>
                            <tr>
                                <td colspan="2">
                                    <div class="form-check">
                                        <input type="checkbox" name="receivePrivateMessages" class="form-check-input" id="pmCheckbox" />
                                        <label class="form-check-label" for="pmCheckbox">
                                            مایل به دریافت پیام خصوصی از بقیه اعضای سایت هستم
                                        </label>
                                    </div>
                                </td>
                            </tr>
                        </table>

                        <br />
                        <div class="text-center">
                            <button type="submit" class="green-button">ثبت نام</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Footer inclusion -->
<div th:replace="fragments/footer :: footer"></div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
